  (() => {

        !cursor ||
        !date ||
        !lineOutput ||
        !lineCursor ||

      let lineSequenceId = 0;
      let selectionPhase = "period";

      const typeTitle = async (id) => {
        output.textContent = "";

          output.textContent += character;
          await sleep(90);

      const sequenceIsActive = (id) =>
        id === lineSequenceId && picker.isConnected;

      const eraseLine = async (id, delay = 48) => {
        if (reduceMotion) {
          lineOutput.textContent = "";

        }

        while (lineOutput.textContent.length > 0) {
          if (!sequenceIsActive(id)) return false;
          lineOutput.textContent = lineOutput.textContent.slice(0, -1);
          await sleep(delay);
        }
        return sequenceIsActive(id);
      };

      const typeLine = async (value, id, delay = 62) => {
        if (reduceMotion) {
          lineOutput.textContent = value;
          return true;
        }

        for (const character of value) {
          if (!sequenceIsActive(id)) return false;
          lineOutput.textContent += character;
          await sleep(delay);
        }
        return sequenceIsActive(id);
      };

      const replaceLine = async (
        value,
        id,
        eraseDelay = 48,
        typeDelay = 62,
      ) => {
        lineCursor.classList.add("is-visible");
        if (!(await eraseLine(id, eraseDelay))) return false;
        return typeLine(value, id, typeDelay);
      };

      const clearInput = () => {
        input.value = "";
        inputValue.textContent = "";
        date.classList.remove("has-input-value");
        date.classList.remove("is-input-ready");
      };

      const finishInputPrompt = async (id, eraseDelay = 48, typeDelay = 62) => {
        if (
          !(await replaceLine(config.promptExample, id, eraseDelay, typeDelay))
        )
          return false;
        if (!reduceMotion) await sleep(140);
        if (!sequenceIsActive(id)) return false;

        lineOutput.textContent = "";
        lineCursor.classList.remove("is-visible");
        date.classList.add("is-input-ready");
        selectionPhase = "input";
        input.focus();
        return true;
      };

      const showInput = async () => {
        if (selectionPhase === "input") {
          input.focus();
          return;

        const id = ++lineSequenceId;
        selectionPhase = "transitioning";
        cursor.classList.remove("is-active");
        clearInput();
        status.textContent = "";

      const restorePeriod = async () => {

        const id = ++lineSequenceId;
        selectionPhase = "transitioning";
        clearInput();
        input.blur();
        status.textContent = "";

        lineCursor.classList.remove("is-visible");
        cursor.classList.add("is-active");
        selectionPhase = "period";
      };

      const showValidity = async () => {

        lineCursor.classList.remove("is-visible");
        if (!reduceMotion) {
          for (let count = 0; count < 2; count += 1) {

          !config.importedPeriods.includes(period)

          return;
        }

        window.location.assign(`/music/${config.categorySlug}/${period}/`);
      });
    });
  })();

  (() => {
    const targets = document.querySelectorAll(
      "[data-section-typewriter]:not([data-typewriter-bound])",

      target.setAttribute("data-typewriter-bound", "true");
      const output = target.querySelector("[data-section-type-output]");
      const cursor = target.querySelector("[data-section-type-cursor]");
      const text = target.getAttribute("data-section-typewriter") || "";
      if (!output || !cursor || !text) return;

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        output.textContent = text;
        cursor.classList.add("is-active");
        return;
      }

      output.textContent = "";
      const showText = async () => {
        cursor.classList.add("is-active");
        for (const character of text) {
          if (!target.isConnected) return;
          output.textContent += character;
          await new Promise((resolve) => setTimeout(resolve, 90));
        }
      };

      const observer = new IntersectionObserver(
        (entries) => {
          if (!entries.some((entry) => entry.isIntersecting)) return;
          observer.disconnect();
          showText();
        },
        { threshold: 0.4 },
      );

      observer.observe(target);
    });
  })();
