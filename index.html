">Less is ...</span> <span class="hero-type-live"> <span data-terminal-title>Taki_Tani;</span><span class="hero-terminal-cursor" data-terminal-title-cursor></span> </span> </span> </h1> </div> <script data-astro-rerun>
  (() => {
    const terminals = document.querySelectorAll(
      "[data-terminal-config]:not([data-terminal-bound])",
    );

    terminals.forEach((terminal) => {
      terminal.setAttribute("data-terminal-bound", "true");
      const config = JSON.parse(terminal.getAttribute("data-terminal-config"));
      const leadOutput = terminal.querySelector("[data-terminal-lead]");
      const titleOutput = terminal.querySelector("[data-terminal-title]");
      const leadCursor = terminal.querySelector("[data-terminal-lead-cursor]");
      const titleCursor = terminal.querySelector(
        "[data-terminal-title-cursor]",
      );
      if (!leadOutput || !titleOutput || !leadCursor || !titleCursor) return;

      const sleep = (time) =>
        new Promise((resolve) => setTimeout(resolve, time));
      const holdTime = () => 4000 + Math.floor(Math.random() * 2001);
      const setCursor = (activeCursor) => {
        leadCursor.classList.toggle("is-active", activeCursor === leadCursor);
        titleCursor.classList.toggle("is-active", activeCursor === titleCursor);
      };
      const type = async (node, value) => {
        for (const character of value) {
          if (!terminal.isConnected) return false;
          node.textContent += character;
          await sleep(90);
        }
        return true;
      };
      const erase = async (node) => {
        while (node.textContent.length > 0) {
          if (!terminal.isConnected) return false;
          node.textContent = node.textContent.slice(0, -1);
          await sleep(55);
        }
        return true;
      };
      const replaceTitle = async (value) => {
        setCursor(titleCursor);
        if (!(await erase(titleOutput))) return false;
        return type(titleOutput, value);
      };
      const replacePair = async (scene) => {
        setCursor(titleCursor);
        if (!(await erase(titleOutput))) return false;
        if (leadOutput.textContent !== scene.lead) {
          setCursor(leadCursor);
          if (!(await erase(leadOutput))) return false;
          if (!(await type(leadOutput, scene.lead))) return false;
          await sleep(180);
        }
        setCursor(titleCursor);
        return type(titleOutput, scene.title);
      };

      const runSequence = async () => {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          leadOutput.textContent = config.initialLead;
          titleOutput.textContent = config.initialTitle;
          setCursor(titleCursor);
          return;
        }

        leadOutput.textContent = "";
        titleOutput.textContent = "";
        setCursor(leadCursor);
        if (!(await type(leadOutput, config.initialLead))) return;
        await sleep(180);
        setCursor(titleCursor);
        if (!(await type(titleOutput, config.initialTitle))) return;

        let currentScene =
          config.scenes.find(
            (scene) =>
              scene.lead === config.initialLead &&
              scene.title === config.initialTitle,
          )?.id ?? "";

        while (terminal.isConnected) {
          await sleep(holdTime());
          const options = config.scenes.filter(
            (scene) => scene.id !== currentScene,
          );
          const nextScene = options[Math.floor(Math.random() * options.length)];
          if (!nextScene || !(await replacePair(nextScene))) return;
          currentScene = nextScene.id;

          if (nextScene.followupTitle) {
            await sleep(nextScene.followupDelay ?? 2000);
            if (!(await replaceTitle(nextScene.followupTitle))) return;
          }
        }
      };

      runSequence();
    });
  })();

  (() => {
    const targets = document.querySelectorAll(
      "[data-section-typewriter]:not([data-typewriter-bound])",
    );

    targets.forEach((target) => {
      target.setAttribute("data-typewriter-bound", "true");
      const output = target.querySelector("[data-section-type-output]");
      const cursor = target.querySelector("[data-section-type-cursor]");
      const text = target.getAttribute("data-section-typewriter") || "";
      if (!output || !cursor || !text) return;

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        output.textContent = text;
        cursor.classList.add("is-active");
        return;
      }

      output.textContent = "";
      const showText = async () => {
        cursor.classList.add("is-active");
        for (const character of text) {
          if (!target.isConnected) return;
          output.textContent += character;
          await new Promise((resolve) => setTimeout(resolve, 90));
        }
      };

      const observer = new IntersectionObserver(
        (entries) => {
          if (!entries.some((entry) => entry.isIntersecting)) return;
          observer.disconnect();
          showText();
        },
        { threshold: 0.4 },
      );

      observer.observe(target);
    });
  })();
