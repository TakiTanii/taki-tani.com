  (() => {
    const targets = document.querySelectorAll(
      "[data-section-typewriter]:not([data-typewriter-bound])",
    );

    targets.forEach((target) => {
      target.setAttribute("data-typewriter-bound", "true");
      const output = target.querySelector("[data-section-type-output]");
      const cursor = target.querySelector("[data-section-type-cursor]");
      const text = target.getAttribute("data-section-typewriter") || "";
      if (!output || !cursor || !text) return;

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        output.textContent = text;
        cursor.classList.add("is-active");
        return;
      }

      output.textContent = "";
      const showText = async () => {
        cursor.classList.add("is-active");
        for (const character of text) {
          if (!target.isConnected) return;
          output.textContent += character;
          await new Promise((resolve) => setTimeout(resolve, 90));
        }
      };

      const observer = new IntersectionObserver(
        (entries) => {
          if (!entries.some((entry) => entry.isIntersecting)) return;
          observer.disconnect();
          showText();
        },
        { threshold: 0.4 },
      );

      observer.observe(target);
    });
  })();
